<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>pointille — demo</title>
  <style>
    :root {
      --bg: #fafaf7;
      --fg: #1a1a1a;
      --muted: #777;
      --line: #c8c8c0;
      --cell: rgba(80, 110, 200, 0.06);
      --cellEdge: #b6bdcd;
      --boundary: #1a1a1a;
      --site: #c2410c;
    }
    html, body { background: var(--bg); color: var(--fg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      margin: 0; padding: 32px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
    table { border-collapse: collapse; margin: 0 auto; }
    th, td { padding: 6px; text-align: center; vertical-align: top; }
    th { font-weight: 600; font-size: 14px; color: var(--fg); border-bottom: 1px solid var(--line); }
    .cell {
      position: relative;
      width: 220px; height: 220px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      box-sizing: content-box;
    }
    .cell .label {
      position: absolute; top: 6px; left: 8px;
      font-size: 11px; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    svg { display: block; width: 100%; height: 100%; }
    svg .cells path {
      fill: var(--cell);
      stroke: var(--cellEdge);
      stroke-width: 0.6;
    }
    svg .boundary {
      fill: none;
      stroke: var(--boundary);
      stroke-width: 1.4;
      stroke-linejoin: round;
    }
    svg .sites circle {
      fill: var(--site);
      stroke: #fff;
      stroke-width: 1;
    }
  </style>
</head>
